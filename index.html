<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guía interactiva de Física Mecánica Newtoniana organizada por módulos estudia a tu ritmo, .">
  <title>NewtonLab | Física Mecánica</title>
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] }, svg: { fontCache: 'global' } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>
  <header class="app-header">
    <a class="brand" href="#/home" aria-label="NewtonLab, ir al inicio">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M8 25c5-12 19-14 24-3M10 15c7 0 13 7 20 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="26" cy="13" r="3" fill="currentColor"/>
      </svg>
      <span>NewtonLab</span>
    </a>
    <div class="header-actions">
      <span class="header-label">Mecánica interactiva</span>
      <button class="icon-button" type="button" data-theme-toggle aria-label="Cambiar tema" title="Cambiar tema">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>
  <main id="app" tabindex="-1" aria-live="polite">
    <section class="loading-state" aria-label="Cargando contenido">
      <div class="skeleton skeleton-heading"></div>
      <div class="skeleton skeleton-text"></div>
      <div class="skeleton skeleton-text"></div>
    </section>
  </main>
  <noscript>Esta aplicación necesita JavaScript activado.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
